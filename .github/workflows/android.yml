name: Build Noor Teacher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          mkdir -p source
          unzip -o noor_teacher_android_project.zip -d source
          cd source/noor_teacher_android_project
          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd source/noor_teacher_android_project/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Teacher-APK
          path: source/noor_teacher_android_project/android/app/build/outputs/apk/debug/app-debug.apk
